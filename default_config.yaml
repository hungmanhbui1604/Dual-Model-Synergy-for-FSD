general:
  seed: 42

wandb:
  api_key: null
  project: "DualModel"

data:
  split_path: "data/pad_splits.json"
  transform_name: "dual_model"

training:
  epochs: 50
  batch_size: 128
  num_workers: 8
  pin_memory: true
  checkpoint_interval: 10

model:
  model_name: "dual_model"
  num_classes: 1
  ckpt_path: null

optimizer:
  opt_name: "adam"
  lr: 1.0e-3
  weight_decay: 1.0e-4

scheduler:
  sched_name: "cosine"
  warmup_epochs: 3
  min_lr: 1.0e-5

output:
  checkpoint_dir: "ckpts/"
  best_model_name: "best_model.pth"

evaluation:
  batch_size: 128
